
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточка студента</title>

    <style>
        body {
            margin: 0;
            padding: 40px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1b1035, #492477);
            color: white;
        }

        .container {
            max-width: 500px;
            margin: 50px auto;
            padding: 30px;
            background: #ffffff;
            color: #222;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #6427a8;
        }

        #studentInfo {
            font-size: 17px;
            line-height: 1.8;
        }

        p {
            border-bottom: 1px solid #ddd;
            padding-bottom: 8px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Карточка студента</h1>
        <div id="studentInfo"></div>
    </div>

    <script src="script.js"></script>

</html>
