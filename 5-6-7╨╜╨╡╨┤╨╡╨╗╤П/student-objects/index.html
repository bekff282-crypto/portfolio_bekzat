
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Электронный журнал студентов</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Электронный журнал успеваемости</h1>

        <section>
            <h2>Добавить студента</h2>

            <form id="studentForm">
                <input type="text" id="studentName" placeholder="Имя студента" required>
                <input type="number" id="studentAge" placeholder="Возраст" min="1" required>
                <input type="text" id="studentGroup" placeholder="Группа" required>
                <input type="number" id="studentGrade" placeholder="Оценка от 0 до 100" min="0" max="100" required>

                <button type="submit">Добавить студента</button>
            </form>
        </section>

        <section>
            <h2>Список студентов</h2>

            <table>
                <thead>
                    <tr>
                        <th>№</th>
                        <th>Имя</th>
                        <th>Возраст</th>
                        <th>Группа</th>
                        <th>Оценка</th>
                        <th>Уровень</th>
                        <th>Действия</th>
                    </tr>
                </thead>

                <tbody id="studentTable"></tbody>
            </table>
        </section>

        <section>
            <h2>Поиск студента</h2>

            <input type="text" id="searchInput" placeholder="Введите имя студента">
            <button type="button" onclick="searchStudent()">Найти студента</button>

            <div id="searchResult"></div>
        </section>

        <section>
            <h2>Общая статистика</h2>

            <div id="statistics"></div>
        </section>

        <section>
            <h2>Студенты с задолженностями</h2>

            <div id="failedStudents"></div>
        </section>

        <section>
            <h2>Преподаватели</h2>

            <div id="teacherList"></div>
        </section>

        <section>
            <h2>Назначение оценки преподавателем</h2>

            <form id="teacherForm">

                <select id="teacherSelect" required>
                    <option value="">Выберите преподавателя</option>
                    <option value="0">Дана</option>
                    <option value="1">Арнур</option>
                </select>

                <select id="teacherStudent" required>
                    <option value="">Выберите студента</option>
                </select>

                <input type="number" id="teacherGrade"
                       placeholder="Новая оценка" min="0" max="100" required>

                <button type="submit">Назначить оценку</button>

            </form>

            <div id="teacherMessage"></div>
        </section>

    </div>

    <script src="script.js"></script>

</body>
</html>
