
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор успеваемости</title>

    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1b1035, #492477);
            color: #222;
        }

        .container {
            max-width: 600px;
            margin: 30px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #6427a8;
        }

        h2 {
            color: #6427a8;
            font-size: 20px;
            margin-top: 25px;
        }

        #result {
            font-size: 16px;
            line-height: 1.7;
        }

        p {
            border-bottom: 1px solid #eee;
            padding-bottom: 7px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Калькулятор успеваемости</h1>

        <div id="result"></div>
    </div>

    <script src="script.js"></script>

</body>
</html>
